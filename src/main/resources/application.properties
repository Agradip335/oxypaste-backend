spring.application.name=your-app-name
application.base-url=https://your-domain.com/

application.documents.readme=classpath:README.md
application.documents.license=classpath:LICENSE.md
application.mail-registration=true

spring.datasource.url=jdbc:mysql://localhost:3306/your_db
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

security.max-sessions=5
security.max-api-tokens=20
security.session-expiry=1440
security.verification-token-secret=your-verification-secret-key
security.verification-token-expiry=60
security.recaptcha-secret-key=your-recaptcha-secret-key

spring.mail.host=smtp.your-mail-provider.com
spring.mail.port=587
spring.mail.username=your-email@example.com
spring.mail.password=your-email-password
spring.mail.from=your-email@example.com
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
