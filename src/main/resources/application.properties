spring.application.name=oxypaste

# Database
spring.datasource.url=jdbc:sqlite:oxypaste.db
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.hibernate.ddl-auto=update

application.security.max-sessions=10
application.security.max-api-tokens=10
application.security.recaptcha-secret-key=<change me>
application.security.email-otp-expiry=1

# Email SMTP configuration
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=your.email@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


application.documents.readme=./documents/README.md
application.documents.license=./documents/LICENSE.md

spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100
